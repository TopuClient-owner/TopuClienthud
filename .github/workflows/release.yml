name: Release TopuHUD
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.1","1.21.4","1.21.8","1.21.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        working-directory: ${{ matrix.version }}
        run: gradle clean build --no-daemon
      - name: Rename JAR
        run: |
          mkdir -p release
          cp ${{ matrix.version }}/build/libs/*.jar release/topuhud-${{ matrix.version }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.version }}
          path: release/topuhud-${{ matrix.version }}.jar
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
