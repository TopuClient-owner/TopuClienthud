name: Release TopuHUD
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - version: "1.21.1"
            java: "21"
            gradle: "9.2.0"
          - version: "1.21.4"
            java: "21"
            gradle: "9.2.0"
          - version: "1.21.8"
            java: "21"
            gradle: "9.2.0"
          - version: "1.21.11"
            java: "21"
            gradle: "9.2.0"
          - version: "26.1.2"
            java: "25"
            gradle: "9.5.1"
          - version: "26.2"
            java: "25"
            gradle: "9.5.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build with retry
        working-directory: ${{ matrix.version }}
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if gradle clean build --no-daemon; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then sleep 45; fi
          done
          exit 1
      - name: Rename JAR
        run: |
          mkdir -p release
          cp ${{ matrix.version }}/build/libs/*.jar release/topuhud-${{ matrix.version }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.version }}
          path: release/topuhud-${{ matrix.version }}.jar
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
