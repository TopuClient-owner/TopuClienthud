name: Build TopuHUD 1.20.x

on:
  push:
    branches:
      - 1.20.x-support
  workflow_dispatch:

jobs:
  build:
    name: Build TopuHUD ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - version: "1.20"
            java: "17"
          - version: "1.20.1"
            java: "17"
          - version: "1.20.2"
            java: "17"
          - version: "1.20.3"
            java: "17"
          - version: "1.20.4"
            java: "17"
          - version: "1.20.5"
            java: "21"
          - version: "1.20.6"
            java: "21"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build ${{ matrix.version }}
        working-directory: ${{ matrix.version }}
        run: gradle clean build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TopuHUD-${{ matrix.version }}
          path: ${{ matrix.version }}/build/libs/*.jar
          if-no-files-found: error
