name: Build TopuHUD 1.21.x

on:
  push:
    branches:
      - 1.21.x-support
  workflow_dispatch:

jobs:
  build:
    name: Build TopuHUD ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - version: "1.21"
            java: "21"
          - version: "1.21.1"
            java: "21"
          - version: "1.21.2"
            java: "21"
          - version: "1.21.3"
            java: "21"
          - version: "1.21.4"
            java: "21"
          - version: "1.21.5"
            java: "21"
          - version: "1.21.6"
            java: "21"
          - version: "1.21.7"
            java: "21"
          - version: "1.21.8"
            java: "21"
          - version: "1.21.9"
            java: "21"
          - version: "1.21.10"
            java: "21"
          - version: "1.21.11"
            java: "21"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build ${{ matrix.version }}
        working-directory: ${{ matrix.version }}
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TopuHUD-${{ matrix.version }}
          path: ${{ matrix.version }}/build/libs/*.jar
          if-no-files-found: error
