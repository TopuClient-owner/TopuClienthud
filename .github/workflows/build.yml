name: Build TopuHUD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build TopuHUD ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - version: "1.21.1"
            java: "21"
            gradle: "9.2.0"
          - version: "1.21.4"
            java: "21"
            gradle: "9.2.0"
          - version: "1.21.8"
            java: "21"
            gradle: "9.2.0"
          - version: "1.21.11"
            java: "21"
            gradle: "9.2.0"
          - version: "26.1.2"
            java: "25"
            gradle: "9.5.1"
          - version: "26.2"
            java: "25"
            gradle: "9.5.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Show Java and Gradle versions
        run: |
          java -version
          gradle --version

      - name: Clean build with retry
        working-directory: ${{ matrix.version }}
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "Build attempt $attempt/4 for ${{ matrix.version }}"
            if gradle clean build --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Build failed; waiting 45 seconds before retry..."
              sleep 45
            fi
          done
          exit 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TopuHUD-${{ matrix.version }}
          path: ${{ matrix.version }}/build/libs/*.jar
          if-no-files-found: error
