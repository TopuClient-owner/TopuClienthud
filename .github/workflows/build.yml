```yaml
name: Build TopuHUD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build TopuHUD ${{ matrix.version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.21.1"
          - "1.21.4"
          - "1.21.8"
          - "1.21.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Show Java and Gradle versions
        run: |
          java -version
          gradle --version

      - name: Clean build
        working-directory: ${{ matrix.version }}
        run: gradle clean build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TopuHUD-${{ matrix.version }}
          path: ${{ matrix.version }}/build/libs/*.jar
          if-no-files-found: error
```
